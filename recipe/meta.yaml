{% set name = "holospy" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/holospy-{{ version }}.tar.gz
  sha256: 7b5e563bc11ebcd5ef31b05fbb8fe1afa12484522596523df738fa69e10294c6

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - hyperspy-base >=2.0
    - numpy >=1.20.0
    - pint >=0.10
    - scipy >=1.5.0

test:
  imports:
    - holospy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Analysis of (off-axis) holography data with HyperSpy.
  home: https://github.com/hyperspy/holospy
  license: GPL-3.0-or-later
  license_file: LICENSE
  doc_url: https://hyperspy.org/holospy
  dev_url: https://github.com/hyperspy/holospy

extra:
  recipe-maintainers:
    - CSSFrancis
    - ericpre
    - francisco-dlp
    - jlaehne
